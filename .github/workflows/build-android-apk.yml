name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    env:
      CI: true
      EXPO_NO_TELEMETRY: 1
      EXPO_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_CLIENT_ID || '638940181616-v64e3fhu0tv6f5i4r17jhsp061re2sf4.apps.googleusercontent.com' }}
      EXPO_PUBLIC_GOOGLE_REDIRECT_URI: ${{ secrets.EXPO_PUBLIC_GOOGLE_REDIRECT_URI || 'planodeaula://google-drive-auth' }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease

      - name: Sign release APK
        working-directory: android
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ]; then
            echo "::error::Configure os secrets ANDROID_KEYSTORE_BASE64 e ANDROID_KEYSTORE_PASSWORD para assinar o APK com um certificado fixo."
            exit 1
          fi

          if [ -z "$ANDROID_KEY_ALIAS" ]; then
            ANDROID_KEY_ALIAS="plano-de-aula"
          fi

          if [ -z "$ANDROID_KEY_PASSWORD" ]; then
            ANDROID_KEY_PASSWORD="$ANDROID_KEYSTORE_PASSWORD"
          fi

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > plano-de-aula-release.keystore

          echo "Release certificate fingerprints:"
          keytool -list -v \
            -keystore plano-de-aula-release.keystore \
            -alias "$ANDROID_KEY_ALIAS" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            | grep -E "SHA1|SHA256"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)"
          INPUT_APK="$(find app/build/outputs/apk/release -type f -name '*unsigned*.apk' | head -n 1)"
          if [ -z "$INPUT_APK" ]; then
            INPUT_APK="$(find app/build/outputs/apk/release -type f -name '*.apk' ! -name 'plano-de-aula-release.apk' | head -n 1)"
          fi
          if [ -z "$INPUT_APK" ]; then
            echo "No release APK found in app/build/outputs/apk/release"
            find app/build/outputs -type f || true
            exit 1
          fi
          echo "Signing APK: $INPUT_APK"

          "$APKSIGNER" sign \
            --ks plano-de-aula-release.keystore \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass "pass:$ANDROID_KEYSTORE_PASSWORD" \
            --key-pass "pass:$ANDROID_KEY_PASSWORD" \
            --out app/build/outputs/apk/release/plano-de-aula-release.apk \
            "$INPUT_APK"

          "$APKSIGNER" verify app/build/outputs/apk/release/plano-de-aula-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: plano-de-aula-apk
          path: android/app/build/outputs/apk/release/plano-de-aula-release.apk
          if-no-files-found: error
