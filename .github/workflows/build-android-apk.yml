name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    env:
      CI: true
      EXPO_NO_TELEMETRY: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease

      - name: Sign release APK
        working-directory: android
        run: |
          keytool -genkeypair -v \
            -storetype PKCS12 \
            -keystore plano-de-aula-release.keystore \
            -alias plano-de-aula \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Plano de Aula, OU=EcoEducacional, O=EcoEducacional, L=Luanda, S=Luanda, C=AO"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" sign \
            --ks plano-de-aula-release.keystore \
            --ks-key-alias plano-de-aula \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out app/build/outputs/apk/release/plano-de-aula-release.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk

          "$APKSIGNER" verify app/build/outputs/apk/release/plano-de-aula-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: plano-de-aula-apk
          path: android/app/build/outputs/apk/release/plano-de-aula-release.apk
          if-no-files-found: error
